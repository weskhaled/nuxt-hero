name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm 11 matches the local toolchain and honours the build-script
      # approvals in pnpm-workspace.yaml (esbuild / sharp / @parcel/watcher).
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The root tsconfig.json extends the generated playground/.nuxt/tsconfig.json,
      # which nuxt-module-build + tsc both read — so the playground must be prepared
      # before build / typecheck / test:types on a fresh checkout.
      - name: Prepare Nuxt (generate playground/.nuxt)
        run: pnpm exec nuxi prepare playground

      - name: Lint (oxlint)
        run: pnpm exec oxlint .

      # Builds the module (nuxt-module-build) — also validates the published dist.
      - name: Build
        run: pnpm build

      # Every path in package.json `exports` must exist in the built dist — a
      # build-tool upgrade once silently moved the plain-Vue .d.ts files.
      - name: Verify package exports resolve
        run: |
          node -e '
            const { existsSync } = require("node:fs")
            const paths = Object.values(require("./package.json").exports)
              .flatMap(v => typeof v === "string" ? [v] : Object.values(v))
            const missing = paths.filter(p => !existsSync(p))
            if (missing.length) { console.error("Missing export targets:", missing); process.exit(1) }
            console.log(`All ${paths.length} export targets exist.`)
          '

      # Consumer-grade smoke test: a plain Vite+Vue app building against the
      # freshly built dist — with NO gsap / hls.js / Tailwind installed. Fails
      # if an optional dependency leaks back into the reachable module graph.
      - name: Build plain-Vue example (no optional deps)
        run: pnpm --filter nuxt-hero-example-vue build

      - name: Typecheck (playground)
        run: pnpm typecheck

      - name: Type tests
        run: pnpm test:types

      - name: Unit tests
        run: pnpm test
